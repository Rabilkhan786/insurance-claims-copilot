project:
  data_dir: Data/insurance_documents
  artifacts_dir: artifacts

models:
  embedding: BAAI/bge-base-en-v1.5
  cross_encoder: BAAI/bge-reranker-base
  llm: openai/gpt-oss-120b
  temperature: 0.0

pinecone:
  dense_index: insurance-rag
  sparse_index: insurance-rag-sparse
  namespace: insurance
  cloud: aws
  region: us-east-1
  dense_dimension: 768
  dense_metric: cosine
  sparse_model: pinecone-sparse-english-v0

retrieval:
  dense_top_k: 15
  sparse_top_k: 15
  final_top_k: 8
  rrf_k: 60

chunking:
  strategy: section_aware
  max_chunk_size: 800
  min_chunk_size: 100
  tag_topics: true
  skip_patterns:
    - "registered office"
    - "IRDAI registration"
    - "grievance redressal"
    - "toll free"
    - "bimalokpal"

cache:
  rag_ttl_seconds: 3600

api:
  host: 0.0.0.0
  port: 8000

database:
  crm_path: data/crm.db

batch_size: 96

table_extraction:
  enabled: true
  min_rows: 2
  min_cols: 2
