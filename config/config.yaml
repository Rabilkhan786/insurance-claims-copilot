project:
  name: insurance-rag-chatbot
  data_dir: Data/insurance_documents
  artifacts_dir: artifacts


models:
  embedding: BAAI/bge-base-en-v1.5
  cross_encoder: BAAI/bge-reranker-base
  llm: llama-3.1-8b-instant
  temperature: 0.0


pinecone:
  dense_index: insurance-rag
  sparse_index: insurance-rag-sparse
  namespace: insurance
  cloud: aws
  region: us-east-1
  dense_dimension: 768
  dense_metric: cosine
  sparse_model: pinecone-sparse-english-v0


retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  rrf_top_k: 10
  final_top_k: 5
  rrf_k: 60


chunking:
  combine_text_under_n_chars: 200
  new_after_n_chars: 800
  max_characters: 1000
  min_characters: 50

memory:
  max_messages: 6

voice:
  model: base
  language: en
  sample_rate: 16000

api:
  host: 0.0.0.0
  port: 8000
batch_size: 96
