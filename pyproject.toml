[project]
name = "health-agentic-rag"
version = "1.0.0"
description = "AI claims copilot: hybrid RAG over IRDAI policy documents, a deterministic eligibility engine, and human-reviewed recommendations."
readme = "README.md"
# Pinned to one minor version, and the same one the Dockerfile installs.
# ">=3.10" let the image resolve to 3.14 while development ran on 3.11, so
# the two environments were never resolving the same wheels.
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- API and UI ---
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.4",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    # --- agent and workflow ---
    "langchain>=1.3.15",
    # EnsembleRetriever and ContextualCompressionRetriever live here in v1.
    "langchain-classic>=1.0.8",
    # HuggingFaceCrossEncoder (the reranker) lives here.
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.1.0",
    # --- retrieval ---
    # torch is declared here only so the CPU-only index below can apply to
    # it. sentence-transformers pulls it in either way; a uv source override
    # has no effect on a purely transitive dependency.
    "torch>=2.0.0",
    "sentence-transformers>=3.3.1",
    "pinecone>=5.4.2",
    # Retry policy for Pinecone upserts and for the evaluation runner's
    # rate-limited calls. Replaces two hand-written sleep loops.
    "tenacity>=8.0.0",
    # --- document ingestion ---
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
# RAGAS pulls a large evaluation stack -- keep it out of the runtime install.
# Pinned to 0.2.15: newer 0.4.x pulls in scikit-network, which has no
# prebuilt wheel for this Python version and fails to compile without
# Visual C++ Build Tools.
evaluation = [
    "ragas==0.2.15",
    # The judge and answer models speak the OpenAI protocol (pointed at
    # Cerebras), and RAGAS 0.2.15 needs nest-asyncio patched out.
    "langchain-openai>=1.5.1",
    "nest-asyncio>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The user's normal Windows temp dir (%TEMP%\pytest-of-<user>) is not
# writable in this sandboxed environment, so pytest's tmp_path fixture
# fails with PermissionError. A repo-local temp dir sidesteps that.
addopts = "--basetemp=.pytest_tmp"

[tool.setuptools]
packages = ["src", "config"]

# Pull torch from PyTorch's CPU-only index.
#
# WHY: torch's default wheels depend on ~19 Linux-only CUDA packages
# (nvidia-cublas, nvidia-cudnn, nccl, triton, cuda-toolkit ...), several GB
# in total. Nothing here uses a GPU -- the embedder and the cross-encoder
# both log "No device provided, using cpu" -- and Windows never installed
# them anyway because of their platform markers. Without this the Docker
# image (Linux) downloads every one of them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
