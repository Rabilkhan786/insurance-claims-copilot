[project]
name = "health-agentic-rag"
version = "1.0.0"
description = "AI claims copilot with hybrid RAG, deterministic eligibility checks, and human-reviewed recommendations."
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.4",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "langchain>=1.3.15",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "torch>=2.0.0",
    "sentence-transformers>=3.3.1",
    "pinecone>=5.4.2",
    "tenacity>=8.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
evaluation = [
    "ragas==0.2.15",
    "nest-asyncio>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.setuptools]
packages = ["src", "config"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
